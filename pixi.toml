[workspace]
name = "brava-variant-annotation"
description = "BRaVa variant annotation: VEP 105 + LOFTEE + REVEL/CADD + SpliceAI -> SAIGE group files"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64"]

[dependencies]
python = "3.10.*"
pandas = ">=1.5,<3"
numpy = "<2"
bcftools = "1.21.*"
htslib = "1.21.*"
samtools = "1.21.*"
# VEP 105 and LOFTEE's perl dependencies (same set as the original vep105_loftee Dockerfile)
ensembl-vep = "105.0.*"
perl-bio-bigfile = "*"
perl-dbd-sqlite = "*"
perl-list-moreutils = "*"
# SpliceAI loads Keras 2 .h5 models, so TensorFlow must stay below 2.16 (Keras 3)
tensorflow = "2.15.*"
pyfaidx = "*"
pysam = "*"
# spliceai imports pkg_resources, which setuptools 81 removes
setuptools = "<81"
git = "*"
curl = "*"

[pypi-dependencies]
# Invitae/geertvandeweyer fork: identical to Illumina SpliceAI 1.3.1 when -B 1, adds GPU batching for -B > 1
spliceai = { git = "https://github.com/geertvandeweyer/SpliceAI.git", rev = "d23f835dff11326e7a58fb9c522b4b9a7518b19e" }

[feature.gpu]
platforms = ["linux-64"]

[feature.gpu.system-requirements]
cuda = "12"

[feature.gpu.dependencies]
tensorflow = { version = "2.15.*", build = "cuda*" }

[feature.test.dependencies]
python = "3.10.*"
pandas = ">=1.5,<3"
numpy = "<2"

[environments]
default = { solve-group = "cpu" }
gpu = { features = ["gpu"] }
# light environment for CI / the equivalence tests (no VEP, TensorFlow, ...)
test = { features = ["test"], no-default-feature = true }

[tasks]
brava-annotate = "bin/brava-annotate"

[feature.test.tasks]
test = "python tests/test_equivalence.py && python validate/compare.py self-test"
